apiVersion: v1
kind: Namespace
metadata:
  name: anycompany
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-agent
  namespace: anycompany
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-agent
  template:
    metadata:
      labels:
        app: customer-agent
    spec:
      containers:
            - name: agent
        image: nginx:alpine
        ports:
                - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: customer-agent
  namespace: anycompany
spec:
  selector:
    app: customer-agent
  ports:
    - port: 80
    targetPort: 80
---
